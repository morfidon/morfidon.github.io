<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Arkadiusz Włodarczyk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <main>
        <section id="contact-hero" class="section">
            <p class="eyebrow">Contact</p>
            <h1>Let's Talk</h1>
            <p>Have a question about a course, learning path, or collaboration? Send a message.</p>
        </section>

        <section id="contact-form" class="section">
            <form action="https://formspree.io/f/mblrqewb" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="_replyto" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="cta-button">Send Message</button>
            </form>
        </section>

        <section id="contact-info" class="section">
            <h2>Find Me Online</h2>
            <ul>
                <li><a href="https://www.udemy.com/user/arkadiuszwodarczyk/" target="_blank" rel="noopener noreferrer">Udemy</a></li>
                <li><a href="https://www.skillshare.com/en/r/user/morfidon" target="_blank" rel="noopener noreferrer">Skillshare</a></li>
                <li><a href="https://www.youtube.com/@GameDevForNoobs" target="_blank" rel="noopener noreferrer">YouTube</a></li>
                <li><a href="https://www.linkedin.com/in/arkadiusz-w%C5%82odarczyk-99ab03141/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
            </ul>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/include-common-elements.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
